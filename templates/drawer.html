<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRI - Perfect Alignment</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Your Brand Palette */
        :root {
            --carbon-black: #171711;
            --princeton-orange: #ff8200;
            --white: #ffffff;
            --header-height: 64px;
            --horizontal-padding: 20px;
            --icon-box-width: 40px; /* Fixed width for icons to prevent logo jumping */
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }

        /* Common Header Style for both Header and Drawer-Top */
        .header-layout {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 var(--horizontal-padding);
            background: var(--white);
            border-bottom: 1px solid #eee;
            box-sizing: border-box;
        }

        .icon-trigger {
            width: var(--icon-box-width);
            display: flex;
            align-items: center;
            cursor: pointer;
            color: var(--carbon-black);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--carbon-black);
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .logo span { color: var(--princeton-orange); }

        /* --- THE DRAWER (Static Toggle) --- */
        #hri-drawer {
            display: none; /* No animation, just on/off */
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100%;
            background: var(--white);
            z-index: 1000;
            box-shadow: 10px 0 20px rgba(0,0,0,0.1);
        }

        #drawer-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        /* Active State */
        body.drawer-active #hri-drawer,
        body.drawer-active #drawer-overlay {
            display: block;
        }

        /* Drawer Content */
        .drawer-links {
            padding: 10px 0;
        }

        .drawer-item {
            display: flex;
            align-items: center;
            padding: 15px var(--horizontal-padding);
            color: var(--carbon-black);
            text-decoration: none;
            font-weight: 600;
        }

        .drawer-item i {
            margin-right: 15px;
            width: 20px;
        }
    </style>
</head>
<body id="main-body">

    <header class="header-layout">
        <div class="icon-trigger" onclick="toggleDrawer()">
            <i data-lucide="menu"></i>
        </div>
        <a href="#" class="logo">HRI<span>.</span>SHOP</a>
    </header>

    <div id="drawer-overlay" onclick="toggleDrawer()"></div>

    <div id="hri-drawer">
        <div class="header-layout">
            <div class="icon-trigger" onclick="toggleDrawer()">
                <i data-lucide="x"></i>
            </div>
            <div class="logo">HRI<span>.</span>SHOP</div>
        </div>

        <nav class="drawer-links">
            <a href="#" class="drawer-item"><i data-lucide="package"></i> Vos commandes</a>
            <a href="#" class="drawer-item"><i data-lucide="heart"></i> Favoris</a>
            <a href="#" class="drawer-item"><i data-lucide="help-circle"></i> Besoin d'aide?</a>
        </nav>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        function toggleDrawer() {
            document.getElementById('main-body').classList.toggle('drawer-active');
        }
    </script>
</body>
</html>
