<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumia Style Drawer</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --text-gray: #75757a;
            --text-black: #282828;
            --border-color: #f1f1f1;
            --orange: #f68b1e;
        }

        body {
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #7f7f7f; /* Dimmed background background */
        }

        /* Drawer Container */
        .drawer {
            width: 300px;
            background: white;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        /* Header Section */
        .drawer-header {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .close-btn { margin-right: 20px; cursor: pointer; }
        
        .logo {
            font-weight: bold;
            font-size: 24px;
            display: flex;
            align-items: center;
        }

        /* Section Titles */
        .section-title {
            padding: 15px;
            font-size: 13px;
            color: var(--text-gray);
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 8px solid #f5f5f5; /* Grey divider block */
        }

        .section-title.first { border-top: none; }

        .view-more {
            color: var(--orange);
            text-transform: none;
            font-size: 14px;
            cursor: pointer;
        }

        /* Menu Items */
        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: var(--text-black);
            text-decoration: none;
            transition: background 0.2s;
            cursor: pointer;
        }

        .menu-item:hover { background-color: #f8f8f8; }

        .menu-item i {
            margin-right: 15px;
            color: #313133;
            width: 24px;
            height: 24px;
        }

        .menu-item .label {
            flex-grow: 1;
            font-size: 15px;
        }

        .chevron-right {
            color: var(--text-gray);
            width: 16px !important;
        }

        /* Special Header Links */
        .header-link {
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="drawer">
    <div class="drawer-header">
        <i data-lucide="x" class="close-btn"></i>
        <div class="logo">JUMIA <span style="color:var(--orange); margin-left:2px;">★</span></div>
    </div>

    <a class="menu-item header-link">
        <span class="label">BESOIN D'AIDE?</span>
        <i data-lucide="chevron-right" class="chevron-right"></i>
    </a>
    <a class="menu-item header-link">
        <span class="label">VOTRE COMPTE JUMIA</span>
        <i data-lucide="chevron-right" class="chevron-right"></i>
    </a>

    <div class="menu-list">
        <div class="menu-item"><i data-lucide="package"></i><span class="label">Vos commandes</span></div>
        <div class="menu-item"><i data-lucide="message-square"></i><span class="label">Vos avis en attente</span></div>
        <div class="menu-item"><i data-lucide="ticket"></i><span class="label">Bons d'achat</span></div>
        <div class="menu-item"><i data-lucide="heart"></i><span class="label">Favoris</span></div>
    </div>

    <div class="section-title">
        <span>NOS CATÉGORIES</span>
        <span class="view-more">Voir plus</span>
    </div>

    <div class="menu-list">
        <div class="menu-item"><i data-lucide="pipette"></i><span class="label">Beauté & Santé</span></div>
        <div class="menu-item"><i data-lucide="shirt"></i><span class="label">Vêtements & Chaussures</span></div>
        <div class="menu-item"><i data-lucide="watch"></i><span class="label">Accessoires Mode</span></div>
        <div class="menu-item"><i data-lucide="home"></i><span class="label">Maison & Cuisine</span></div>
        <div class="menu-item"><i data-lucide="smartphone"></i><span class="label">Téléphone & Tablette</span></div>
        <div class="menu-item"><i data-lucide="monitor"></i><span class="label">Informatique</span></div>
        <div class="menu-item"><i data-lucide="apple"></i><span class="label">Supermarché</span></div>
        <div class="menu-item"><i data-lucide="dumbbell"></i><span class="label">Sports & Loisirs</span></div>
        <div class="menu-item"><i data-lucide="tv"></i><span class="label">TV & Hi Tech</span></div>
    </div>
</div>

<script>
    // Initialize Lucide icons
    lucide.createIcons();
</script>

</body>
</html>
