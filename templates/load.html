<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matjar El Kotobia — Awesome Grocery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --carbon-black: #171711;
            --alice-blue: #eaf6ff;
            --princeton-orange: #ff8200;
            --medium-jungle: #089b43;
            --white: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--white);
            overflow-x: hidden;
        }

        /* --- 1. HERO HOME LOADER (Initial Scan) --- */
        #hri-home-loader {
            position: fixed; inset: 0; background: var(--white); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .barcode-wrap { text-align: center; position: relative; }
        .laser {
            position: absolute; top: 0; left: -10%; width: 120%; height: 3px;
            background: var(--princeton-orange); box-shadow: 0 0 10px var(--princeton-orange);
            animation: scan-loop 0.8s infinite alternate ease-in-out;
        }
        @keyframes scan-loop { from { top: 0%; } to { top: 100%; } }

        /* --- 2. MICRO DATA LOADER (Middle of Screen + Blur) --- */
        #hri-data-handler {
            position: fixed; inset: 0; z-index: 11000;
            display: none; align-items: center; justify-content: center;
            pointer-events: none;
        }
        
        #hri-data-handler.active { display: flex; }

        .loading-center-icon {
            background: var(--white);
            width: 80px; height: 80px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            color: var(--princeton-orange);
            animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .pulse-ring {
            position: absolute; width: 80px; height: 80px;
            border: 2px solid var(--princeton-orange);
            border-radius: 50%;
            animation: ring-pulse 1s infinite;
        }

        @keyframes ring-pulse {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        @keyframes pop-in { from { transform: scale(0); } to { transform: scale(1); } }

        /* --- 3. BLUR LOGIC --- */
        #main-wrapper { transition: filter 0.4s ease, transform 0.4s ease; }
        body.is-processing #main-wrapper {
            filter: blur(10px) brightness(0.9);
            transform: scale(0.98);
            pointer-events: none;
        }

        /* Top Progress Bar */
        #hri-top-bar {
            position: fixed; top: 0; left: 0; height: 4px; width: 0%;
            background: var(--princeton-orange); z-index: 12000;
            transition: width 0.4s ease; opacity: 0;
        }
        #hri-top-bar.visible { opacity: 1; }

        /* --- 4. CONTENT UI --- */
        .hri-header {
            height: 64px; display: flex; align-items: center; padding: 0 20px;
            border-bottom: 1px solid #eee; background: white;
        }
        .product-preview {
            width: 100%; aspect-ratio: 1/1; background: var(--alice-blue);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .product-info { padding: 25px 20px; }
        .price-tag { font-size: 26px; font-weight: 800; color: var(--princeton-orange); margin: 10px 0; }

        /* --- 5. STICKY BAR --- */
        .sticky-footer {
            position: fixed; bottom: 0; width: 100%; padding: 15px 20px;
            box-sizing: border-box; background: white; border-top: 1px solid #eee;
            display: flex; gap: 12px; z-index: 900;
        }
        .btn-call {
            width: 54px; height: 54px; border-radius: 12px;
            background: var(--alice-blue); display: flex; align-items: center; justify-content: center;
            text-decoration: none; color: var(--carbon-black);
        }
        .btn-buy {
            flex-grow: 1; background: var(--princeton-orange); color: white;
            border: none; border-radius: 12px; font-weight: 800; font-size: 16px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .qty-controls {
            display: none; flex-grow: 1; background: var(--medium-jungle);
            border-radius: 12px; align-items: center; justify-content: space-between;
            color: white; padding: 0 5px;
        }
        body.has-items .btn-buy { display: none; }
        body.has-items .qty-controls { display: flex; }
        .q-btn { width: 44px; height: 44px; border: none; background: transparent; color: white; font-size: 24px; font-weight: 800; }

        .loader-hidden { opacity: 0; visibility: hidden; }
    </style>
</head>
<body id="hri-body">

    <div id="hri-home-loader">
        <div class="barcode-wrap">
            <div class="laser"></div>
            <i data-lucide="barcode" size="64"></i>
            <div style="margin-top:15px; font-weight:900;">MATJAR<span style="color:var(--princeton-orange)">.</span>KOTOBIA</div>
        </div>
    </div>

    <div id="hri-data-handler">
        <div class="pulse-ring"></div>
        <div class="loading-center-icon">
            <i id="dynamic-icon" data-lucide="shopping-basket" size="32"></i>
        </div>
    </div>
    
    <div id="hri-top-bar"></div>

    <div id="main-wrapper">
        <header class="hri-header">
            <i data-lucide="arrow-left"></i>
            <div style="flex-grow: 1; text-align: center; font-weight: 800;">Détails</div>
            <i data-lucide="search"></i>
        </header>

        <div class="product-preview">
            <img src="https://images.unsplash.com/photo-1523381210434-271e8be1f52b?w=500" style="width:70%;">
        </div>

        <div class="product-info">
            <h1 style="margin:0; font-size:24px;">Farine Fleur de Safi</h1>
            <div class="price-tag">45.00 DH</div>
            <p style="color:#666; line-height: 1.6;">Qualité premium pour vos pâtisseries et pains maison. Produit phare de notre boutique à Safi.</p>
        </div>
    </div>

    <footer class="sticky-footer">
        <a href="tel:+212600000000" class="btn-call" onclick="handleAction('phone')">
            <i data-lucide="phone"></i>
        </a>

        <button class="btn-buy" onclick="handleAction('shopping-cart', 'add')">
            <i data-lucide="shopping-cart"></i> Acheter
        </button>

        <div class="qty-controls">
            <button class="q-btn" onclick="handleAction('minus', 'sub')">−</button>
            <span style="font-weight:800;" id="qty-text">1</span>
            <button class="q-btn" onclick="handleAction('plus', 'add')">+</button>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        let currentQty = 0;

        // Auto-hide Hero Loader
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('hri-home-loader').classList.add('loader-hidden');
            }, 800);
        });

        function handleAction(iconName, calcType) {
            const body = document.getElementById('hri-body');
            const handler = document.getElementById('hri-data-handler');
            const topBar = document.getElementById('hri-top-bar');
            const iconEl = document.getElementById('dynamic-icon');

            // Set the icon to match the action
            iconEl.setAttribute('data-lucide', iconName);
            lucide.createIcons();

            // Start "Handling Data" State
            body.classList.add('is-processing');
            handler.classList.add('active');
            topBar.classList.add('visible');
            topBar.style.width = "40%";

            setTimeout(() => {
                topBar.style.width = "100%";

                setTimeout(() => {
                    // Update Logic
                    if(calcType === 'add') currentQty++;
                    if(calcType === 'sub') currentQty = Math.max(0, currentQty - 1);

                    // Update UI
                    document.getElementById('qty-text').innerText = currentQty;
                    if(currentQty > 0) body.classList.add('has-items');
                    else body.classList.remove('has-items');

                    // End "Handling Data" State
                    body.classList.remove('is-processing');
                    handler.classList.remove('active');
                    topBar.classList.remove('visible');
                    topBar.style.width = "0%";
                }, 300);
            }, 400);
        }
    </script>
</body>
</html>
